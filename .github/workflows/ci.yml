name: Continuous Integration

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Bun from the npm registry
        run: |
          npm install --global bun@1.4.4
          bun --version
          bun --revision
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Type check
        run: bun run lint
      - name: Build
        run: bun run build
        env:
          VITE_BASE_PATH: /AI-PDF-STUDIO/
      - name: Verify Pages artifact
        run: bun run verify:pages
        env:
          VITE_BASE_PATH: /AI-PDF-STUDIO/
